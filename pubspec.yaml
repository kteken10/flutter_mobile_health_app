name: mediscanai
description: "Clinical risk screening app for doctors: patients, guided clinical data entry and explained risk scores."
publish_to: 'none'

version: 2.0.0+2

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_flag_selector: ^1.0.2
  mailer: ^6.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/diseases/
    - assets/images/patients/
